plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.6-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

def gitRef() {
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-parse", "--short", "HEAD"
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Throwable ignored) {
        return "unknown"
    }
}

def fullVersion = rootProject.mod_version
if (fullVersion.endsWith("-snapshot")) {
    fullVersion += "-" + new Date().format("yyyyMMdd")
}
fullVersion += "+" + gitRef()

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()

        // javax.annotation.Nullable & co. (not on the 1.20.1 compile classpath by default).
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    version = "MC${rootProject.minecraft_version}-${fullVersion}"
    group = rootProject.maven_group

    repositories {
        // OpenComputers' patched LuaJ / JNLua builds.
        ivy {
            name = "asie dependency mirror"
            url = "https://asie.pl/javadeps/"
            patternLayout {
                artifact "[module]-[revision](-[classifier]).[ext]"
            }
            metadataSources { artifact() }
            content {
                includeModule "", "OC-LuaJ"
                includeModule "", "OC-JNLua"
                includeModule "", "OC-JNLua-Natives"
            }
        }
        // Fallback: drop the jars above into ./libs if the mirror is unreachable.
        flatDir { dirs rootProject.file("libs") }
        maven { url "https://maven.architectury.dev/" }
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
        options.compilerArgs << "-Xmaxerrs" << "10000"
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption("Xdoclint:none", "-quiet")
    }

    java {
        withSourcesJar()
    }
}
