plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "opencomputers-common.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    embedded          // Plain Java libraries, bundled into the jar.
    embeddedNative    // JNLua + its natives, bundled into the jar (see processResources below).
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    implementation.extendsFrom embedded
    compileOnly.extendsFrom embeddedNative
    forgeRuntimeLibrary.extendsFrom embedded
}

repositories {
    maven { url "https://maven.minecraftforge.net/" }
}

// Downloads a mod jar for development runs and rewrites some of its entries (see the uses
// below for why). The result is cached in build/devMods.
def devPatchedJar(String name, String url, Closure patch) {
    def out = layout.buildDirectory.file("devMods/${name}-dev.jar").get().asFile
    if (!out.exists()) {
        out.parentFile.mkdirs()
        def bytes = new URL(url).withInputStream { it.readAllBytes() }
        new java.util.zip.ZipInputStream(new ByteArrayInputStream(bytes)).withCloseable { zin ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(out)).withCloseable { zout ->
                def entry
                while ((entry = zin.nextEntry) != null) {
                    def data = patch(entry.name, zin.readAllBytes())
                    zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    zout.write(data)
                    zout.closeEntry()
                }
            }
        }
    }
    return out
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // Optional mod integrations. Compile-only; add them to dev runs with -Pintegrations=true.
    def integration = { dep ->
        modCompileOnly(dep) { transitive = false }
        if (project.hasProperty("integrations")) modLocalRuntime(dep) { transitive = false }
    }
    integration "appeng:appliedenergistics2-forge:${rootProject.ae2_version}"
    integration "cc.tweaked:cc-tweaked-1.20.1-forge:${rootProject.cct_version}"
    integration "mezz.jei:jei-1.20.1-forge:${rootProject.jei_version}"
    modCompileOnly("maven.modrinth:jade:${rootProject.jade_version}+forge") { transitive = false }
    if (project.hasProperty("integrations")) {
        // Jade's StringRenderOutputMixin shadows Font$StringRenderOutput.this$0, a synthetic field
        // that has no name in Mojang's mappings, so it can't apply in the Forge dev environment
        // and crashes the client (production is fine). Dev runs use a copy of Jade without it.
        modLocalRuntime files(devPatchedJar("Jade-${rootProject.jade_version}-forge",
                "https://api.modrinth.com/maven/maven/modrinth/jade/${rootProject.jade_version}+forge/jade-${rootProject.jade_version}+forge.jar") { name, data ->
            name == "jade.mixins.json" ? new String(data, "UTF-8").replaceAll(/,?\s*"StringRenderOutputMixin"/, "").getBytes("UTF-8") : data
        })
    }
    integration "maven.modrinth:tis3d:MC1.20.1-forge-${rootProject.tis3d_version}"
    // CC: Tweaked's jar-in-jar libraries are not picked up from the dev runtime jar.
    if (project.hasProperty("integrations")) {
        forgeRuntimeLibrary "cc.tweaked:cobalt:0.9.9"
        forgeRuntimeLibrary "com.jcraft:jzlib:1.1.3"
    }
    // TIS-3D runtime dependencies (dev runs only).
    if (project.hasProperty("integrations")) {
        modLocalRuntime("maven.modrinth:markdownmanual:MC1.20.1-forge-1.2.5") { transitive = false }
    }
    integration "mekanism:Mekanism:${rootProject.mekanism_version}"
    modCompileOnly("io.codechicken:CodeChickenLib:${rootProject.codechickenlib_version}:universal") { transitive = false }
    if (project.hasProperty("integrations")) {
        // CodeChickenLib's CCShaderInstance overrides ShaderInstance.parseUniformNode, which is private
        // in vanilla and only opened by CCL's access transformer. Loom's remapper therefore doesn't
        // rename the override in dev, vanilla's method runs, and the client crashes. Dev runs use a
        // copy where the override already carries its dev name (production is unaffected).
        def v = rootProject.codechickenlib_version
        modLocalRuntime files(devPatchedJar("CodeChickenLib-${v}-universal",
                "https://maven.covers1624.net/io/codechicken/CodeChickenLib/${v}/CodeChickenLib-${v}-universal.jar") { name, data ->
            if (name != "codechicken/lib/render/shader/CCShaderInstance.class") return data
            def reader = new org.objectweb.asm.ClassReader(data)
            def writer = new org.objectweb.asm.ClassWriter(0)
            reader.accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9, writer) {
                @Override
                org.objectweb.asm.MethodVisitor visitMethod(int access, String mname, String desc, String sig, String[] ex) {
                    return super.visitMethod(access, mname == "m_173354_" ? "parseUniformNode" : mname, desc, sig, ex)
                }
            }, 0)
            return writer.toByteArray()
        })
    }
    integration "io.codechicken:EnderStorage:${rootProject.enderstorage_version}:universal"
    integration "io.codechicken:CBMultipart:${rootProject.cbmultipart_version}:universal"
    integration "mrtjp:ProjectRed:${rootProject.projectred_version}:transmission"
    modCompileOnly("mrtjp:ProjectRed:${rootProject.projectred_version}:core") { transitive = false }
    if (project.hasProperty("integrations")) {
        // Forge derives module names from jar file names, and the core and transmission jars only
        // differ in their classifier, so one would shadow the other on the dev classpath. Use a
        // renamed copy of the core jar instead.
        def v = rootProject.projectred_version
        modLocalRuntime files(devPatchedJar("ProjectRedCore-${v}",
                "https://maven.covers1624.net/mrtjp/ProjectRed/${v}/ProjectRed-${v}-core.jar") { name, data -> data })
    }
    if (project.hasProperty("integrations")) {
        // JEI's jar-in-jar dependency is not picked up from the dev runtime jar.
        modLocalRuntime("net.mezzdev.config:mezz_config-1.20.1-forge:${rootProject.mezz_config_version}") { transitive = false }
        // AE2 15.x on Forge requires GuideME (Fabric AE2 bundles everything it needs).
        modLocalRuntime("maven.modrinth:guideme:20.1.15") { transitive = false }
    }

    embedded "com.typesafe:config:${rootProject.typesafe_config_version}"
    embedded name: "OC-LuaJ", version: rootProject.luaj_version, ext: "jar"
    embeddedNative name: "OC-JNLua", version: rootProject.jnlua_version, ext: "jar"
    embeddedNative name: "OC-JNLua-Natives", version: rootProject.jnlua_version, ext: "jar"
}

// JNI binds a native library to the class loader of the class that loaded it. In the built
// jar JNLua is part of the mod, but in development Forge would put it on its library
// classpath (a different class loader than the mod's), and LuaState's native methods could
// then never be linked. So in development JNLua and its natives are unpacked into this
// module's resources output, which Forge loads as part of the mod (same class loader).
processResources {
    from({ configurations.embeddedNative.collect { zipTree(it) } }) {
        exclude "META-INF/**"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": rootProject.mod_version, "mcversion": rootProject.minecraft_version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon, project.configurations.embedded]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Embedded jars (LuaJ, JNLua, JNLua natives -> /assets/opencomputers/lib/*, typesafe config) are
    // unpacked into the mod jar; drop their signatures and build metadata.
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC", "META-INF/maven/**", "META-INF/INDEX.LIST"
    relocate "com.typesafe.config", "li.cil.oc.repack.com.typesafe.config"
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
