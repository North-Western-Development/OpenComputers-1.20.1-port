plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
        mixinConfig "opencomputers-common.mixins.json"
    }
}

configurations {
    common
    shadowCommon
    embedded          // Plain Java libraries, bundled into the jar.
    embeddedNative    // JNLua + its natives, bundled into the jar (see processResources below).
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
    implementation.extendsFrom embedded
    compileOnly.extendsFrom embeddedNative
    forgeRuntimeLibrary.extendsFrom embedded
}

repositories {
    maven { url "https://maven.minecraftforge.net/" }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    embedded "com.typesafe:config:${rootProject.typesafe_config_version}"
    embedded name: "OC-LuaJ", version: rootProject.luaj_version, ext: "jar"
    embeddedNative name: "OC-JNLua", version: rootProject.jnlua_version, ext: "jar"
    embeddedNative name: "OC-JNLua-Natives", version: rootProject.jnlua_version, ext: "jar"
}

// JNI binds a native library to the class loader of the class that loaded it. In the built
// jar JNLua is part of the mod, but in development Forge would put it on its library
// classpath (a different class loader than the mod's), and LuaState's native methods could
// then never be linked. So in development JNLua and its natives are unpacked into this
// module's resources output, which Forge loads as part of the mod (same class loader).
processResources {
    from({ configurations.embeddedNative.collect { zipTree(it) } }) {
        exclude "META-INF/**"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": rootProject.mod_version, "mcversion": rootProject.minecraft_version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon, project.configurations.embedded]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Embedded jars (LuaJ, JNLua, JNLua natives -> /assets/opencomputers/lib/*, typesafe config) are
    // unpacked into the mod jar; drop their signatures and build metadata.
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC", "META-INF/maven/**", "META-INF/INDEX.LIST"
    relocate "com.typesafe.config", "li.cil.oc.repack.com.typesafe.config"
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
