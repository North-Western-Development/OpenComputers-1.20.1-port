plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    embedded
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    implementation.extendsFrom embedded
}

repositories {
    maven { url "https://maven.fabricmc.net/" }
}

dependencies {
    // JEI 15.62 requires Fabric Loader 0.19.4+, so dev runs with integrations use a newer loader.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    // Forge Energy equivalent on Fabric. Optional at runtime (see fabric.mod.json "suggests").
    modCompileOnly "teamreborn:energy:${rootProject.tr_energy_version}"
    modLocalRuntime "teamreborn:energy:${rootProject.tr_energy_version}"

    // Optional mod integrations. Compile-only; add them to dev runs with -Pintegrations=true.
    def integration = { dep ->
        modCompileOnly(dep) { transitive = false }
        if (project.hasProperty("integrations")) modLocalRuntime(dep) { transitive = false }
    }
    integration "appeng:appliedenergistics2-fabric:${rootProject.ae2_version}"
    integration "cc.tweaked:cc-tweaked-1.20.1-fabric:${rootProject.cct_version}"
    integration "mezz.jei:jei-1.20.1-fabric:${rootProject.jei_version}"
    integration "maven.modrinth:jade:${rootProject.jade_version}+fabric"
    if (project.hasProperty("integrations")) {
        // JEI's jar-in-jar dependency is not picked up from the dev runtime jar.
        modLocalRuntime("net.mezzdev.config:mezz_config-1.20.1-fabric:${rootProject.mezz_config_version}") { transitive = false }
    }
    integration "maven.modrinth:tis3d:MC1.20.1-fabric-${rootProject.tis3d_version}"
    // CC: Tweaked's libraries (its Fabric jar doesn't nest them; dev runs only).
    if (project.hasProperty("integrations")) {
        localRuntime "cc.tweaked:cobalt:0.9.9"
        localRuntime "com.jcraft:jzlib:1.1.3"
        localRuntime "com.electronwill.night-config:core:3.8.4"
        localRuntime "com.electronwill.night-config:toml:3.8.4"
        localRuntime "io.netty:netty-codec-http:4.1.82.Final"
        localRuntime "io.netty:netty-codec-socks:4.1.82.Final"
        localRuntime "io.netty:netty-handler-proxy:4.1.82.Final"
    }
    // TIS-3D runtime dependencies (dev runs only).
    if (project.hasProperty("integrations")) {
        modLocalRuntime("maven.modrinth:markdownmanual:MC1.20.1-fabric-1.2.5") { transitive = false }
        modLocalRuntime("maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric") { transitive = false }
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    embedded "com.typesafe:config:${rootProject.typesafe_config_version}"
    embedded name: "OC-LuaJ", version: rootProject.luaj_version, ext: "jar"
    embedded name: "OC-JNLua", version: rootProject.jnlua_version, ext: "jar"
    embedded name: "OC-JNLua-Natives", version: rootProject.jnlua_version, ext: "jar"
}

processResources {
    inputs.property "version", project.version
    // fabric.mod.json references the access widener, which lives in common's resources.
    from(project(":common").loom.accessWidenerPath)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching("fabric.mod.json") {
        expand "version": rootProject.mod_version, "mcversion": rootProject.minecraft_version
    }
}

shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon, project.configurations.embedded]
    // Embedded jars (LuaJ, JNLua, JNLua natives -> /assets/opencomputers/lib/*, typesafe config) are
    // unpacked into the mod jar; drop their signatures and build metadata.
    exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC", "META-INF/maven/**", "META-INF/INDEX.LIST"
    relocate "com.typesafe.config", "li.cil.oc.repack.com.typesafe.config"
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "fabric"
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
