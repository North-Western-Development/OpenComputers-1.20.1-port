architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/opencomputers.accesswidener")
}

dependencies {
    // Only for @Environment / mixin annotations; never use Fabric Loader APIs directly in common code.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    api "com.typesafe:config:${rootProject.typesafe_config_version}"
    api name: "OC-LuaJ", version: rootProject.luaj_version, ext: "jar"
    api name: "OC-JNLua", version: rootProject.jnlua_version, ext: "jar"

    // Optional integrations whose APIs are loader-independent. Fabric variants are used for
    // compiling common code (the Architectury convention); see integration/** for usage.
    compileOnly "cc.tweaked:cc-tweaked-1.20.1-common-api:${rootProject.cct_version}"
    // CC: Tweaked's (Minecraft-independent) core, for invoking @LuaFunction peripheral methods
    // (dan200.computercraft.core.methods.*); bundled in the forge/fabric jars at runtime.
    compileOnly("cc.tweaked:cc-tweaked-1.20.1-core:${rootProject.cct_version}") { transitive = false }
    compileOnly "mezz.jei:jei-1.20.1-common-api:${rootProject.jei_version}"
    modCompileOnly("appeng:appliedenergistics2-fabric:${rootProject.ae2_version}") { transitive = false }
    modCompileOnly("maven.modrinth:jade:${rootProject.jade_version}+fabric") { transitive = false }
    modCompileOnly("maven.modrinth:tis3d:MC1.20.1-fabric-${rootProject.tis3d_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    filesMatching("application.conf") {
        filter { line -> line.replace("@VERSION@", rootProject.mod_version) }
    }
}

tasks.register("apiJar", Jar) {
    archiveClassifier = "api"
    from sourceSets.main.allSource
    from sourceSets.main.output
    include "li/cil/oc/api/**"
}

javadoc {
    include "li/cil/oc/api/**"
}
